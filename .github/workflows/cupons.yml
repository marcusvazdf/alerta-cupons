name: Monitor Cupons ML Amazon Shopee
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  check-coupons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_CUPONS_TOKEN: ${{ secrets.TELEGRAM_CUPONS_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python monitor_cupons.py
      - name: Salvar histórico de cupons enviados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico_cupons.json || true
          git diff --staged --quiet || git commit -m "Atualiza histórico de cupons"
          git push
